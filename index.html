<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NEURAFOUR — The ultimate AI-powered Connect Four strategy arena. Challenge intelligent agents, analyze games, and climb the leaderboard." />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>NEURAFOUR — AI Strategy Arena | Connect Four</title>

    <!-- Apply the saved (or system) theme before the app loads, so there is no flash -->
    <script>
      try {
        var saved = localStorage.getItem('neurafour_theme');
        var theme = saved === 'dark' || saved === 'light' ? saved
          : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
